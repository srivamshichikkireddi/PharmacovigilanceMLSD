server {
  listen 80;
  location / { root /usr/share/nginx/html; index index.html; }
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header X-Forwarded-For $remote_addr;   # lets the API rate-limit per real client, not per proxy
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
}
